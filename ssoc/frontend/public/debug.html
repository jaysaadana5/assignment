<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSoC Debug - Check localStorage</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 800px; margin: 0 auto; }
        h1 { color: #d35dab; }
        .section { background: #f5f5f5; padding: 15px; margin: 15px 0; border-radius: 8px; }
        pre { background: #333; color: #0f0; padding: 15px; overflow-x: auto; border-radius: 4px; }
        .success { color: green; }
        .error { color: red; }
        button { background: #d35dab; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin: 5px; }
        button:hover { background: #b84593; }
    </style>
</head>
<body>
    <h1>SSoC Debug Page</h1>
    <p>This page helps debug localStorage sync issues between admin panel and main site.</p>
    
    <div class="section">
        <h3>Current localStorage Data:</h3>
        <pre id="storageData">Loading...</pre>
    </div>
    
    <div class="section">
        <h3>Actions:</h3>
        <button onclick="refreshData()">Refresh Data</button>
        <button onclick="testSave()">Test Save</button>
        <button onclick="clearAll()">Clear All Data</button>
        <button onclick="location.href='/'">Go to Main Site</button>
        <button onclick="location.href='/admin.html'">Go to Admin</button>
    </div>
    
    <div class="section">
        <h3>Status:</h3>
        <div id="status"></div>
    </div>

    <script>
        function refreshData() {
            const data = {
                ssoc_site_data: localStorage.getItem('ssoc_site_data'),
                ssoc_testimonials: localStorage.getItem('ssoc_testimonials'),
                ssoc_faqs: localStorage.getItem('ssoc_faqs'),
                ssoc_apply_links: localStorage.getItem('ssoc_apply_links')
            };
            
            document.getElementById('storageData').textContent = JSON.stringify(data, null, 2);
            
            let status = '';
            if (data.ssoc_site_data) {
                status += '<p class="success">✅ Site data found</p>';
            } else {
                status += '<p class="error">❌ No site data - Go to Admin Panel and save some data first</p>';
            }
            if (data.ssoc_testimonials) {
                const count = JSON.parse(data.ssoc_testimonials).length;
                status += '<p class="success">✅ ' + count + ' testimonials found</p>';
            } else {
                status += '<p class="error">❌ No testimonials</p>';
            }
            document.getElementById('status').innerHTML = status;
        }
        
        function testSave() {
            const testData = {
                heroBadge: 'TEST BADGE - ' + new Date().toLocaleTimeString(),
                heroContributors: '999K+',
                heroProjects: '888+',
                heroPRs: '777K+'
            };
            localStorage.setItem('ssoc_site_data', JSON.stringify(testData));
            alert('Test data saved! Now go to main site and refresh to see if it works.');
            refreshData();
        }
        
        function clearAll() {
            if (confirm('Clear all SSoC data from localStorage?')) {
                localStorage.removeItem('ssoc_site_data');
                localStorage.removeItem('ssoc_testimonials');
                localStorage.removeItem('ssoc_faqs');
                localStorage.removeItem('ssoc_apply_links');
                alert('All data cleared!');
                refreshData();
            }
        }
        
        // Auto refresh on load
        refreshData();
    </script>
</body>
</html>
